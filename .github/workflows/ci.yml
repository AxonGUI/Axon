name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interface:
    name: 接口验证台 ${{ matrix.python-version }}（真 WebEngine 断言）
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # 三个小版本都排，是因为「支持 3.13/3.14」这种话只有跑过才算数：
      # PySide6 发的是 cp310-abi3 轮子，能装不等于能跑（Qt 的 SIP 绑定、
      # asyncio 策略、typing 行为在小版本间都可能变）。
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Qt 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbfile1 libxkbcommon0 libdbus-1-3 libfontconfig1 libnss3 \
            libglib2.0-0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 \
            libxshmfence1 fonts-noto-cjk xvfb \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0 \
            libxcb-sync1 libxcb-glx0 libx11-xcb1 libxkbcommon-x11-0 libgl1-mesa-dri

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core-js/package-lock.json

      - name: 装前端依赖（打包 bundle 用 esbuild）
        working-directory: core-js
        run: npm ci

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: 同步 Python 依赖（含 dev extra：mypy 版本钉在 pyproject 里）
        working-directory: core-py
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: 包能被 import（需要 Qt 运行库，所以放在这个 job）
        working-directory: core-py
        run: .venv/bin/python -c "import axon, axon.cli, axon.AxonGUI; print('axon import ok')"

      - name: 跑验证台
        working-directory: core-py
        run: .venv/bin/python tests/run_web_tests.py

      - name: 跑跨窗口验证（两个真窗口互调）
        working-directory: core-py
        run: .venv/bin/python tests/run_multi_window_tests.py

      # 故障路径：真 SIGKILL 渲染进程、真派发 pagehide。
      # 这条能挡住「崩溃后调用永远悬着」「重载后通道没恢复」这类只在现场出现的问题。
      - name: 跑崩溃恢复 / 断线语义验证
        working-directory: core-py
        run: .venv/bin/python tests/run_resilience_tests.py

      # 真窗口（Xvfb，不是 offscreen 平台）：确认窗口真的出现、页面真的能跑。
      # 平台必须显式给 xcb——offscreen 平台的 isExposed() 也会返回 True，
      # 只有 platform/not_offscreen 那条能把两者区分开。
      - name: 窗口可见性验证（Xvfb + xcb）
        working-directory: core-py
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" .venv/bin/python tests/run_window_visibility_test.py

      - name: 失败时留下报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-tests-report-${{ matrix.python-version }}
          path: |
            core-py/tests/last_report.json
            core-py/tests/last_multi_window_report.json
            core-py/tests/last_resilience_report.json

  frontend:
    name: 前端类型与产物指纹
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core-js/package-lock.json

      - run: npm ci
        working-directory: core-js

      - name: 类型检查（库自身，strict）
        working-directory: core-js
        run: npx tsc --noEmit

      - name: 消费方类型测试（bundler + node16 两种解析，全严格选项）
        working-directory: core-js
        run: npm run test:types

      - name: 构建
        working-directory: core-js
        run: npm run build

      - name: 校验 dist 与 lib 源码一致（指纹，不比对字节）
        working-directory: core-js
        run: git diff --exit-code -- dist/build-info.json

  python-types:
    name: Python 类型（mypy --strict）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: 同步依赖（PySide6 自带 .pyi 桩，装了才查得准）
        working-directory: core-py
        run: uv sync
      - name: 装 mypy（dev extra 里已钉住版本；装进项目 venv 才能看到 PySide6 的桩）
        working-directory: core-py
        run: uv sync --extra dev
      - name: 类型检查
        working-directory: core-py
        run: uv run mypy --strict --ignore-missing-imports --python-version 3.12 axon/
      - name: py.typed 随包发布（PEP 561）
        working-directory: core-py
        run: test -f axon/py.typed
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 第二道门禁: mypy 不查未使用导入/函数, pyright 补上（配置见 core-py/pyrightconfig.json）
      - name: pyright（basic + 未用导入/未用函数）
        working-directory: core-py
        run: npx -y pyright@1.1.414

  python-syntax:
    name: Python 语法（compileall）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: 全部编译一遍
        run: uv run --python 3.12 python -m compileall -q core-py/axon core-py/tests tools
        env:
          PYTHONPATH: ""
