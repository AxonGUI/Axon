name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "core-js/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# 只允许一个 Pages 部署在跑, 但不取消进行中的那次(取消会让站点短暂 404)
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: 安装 core-js 依赖(文档站直接吃 TS 源码, 需要它的 peer 依赖)
        working-directory: core-js
        run: npm ci

      # core-js/dist 是提交进仓库的预构建产物(`axon-gui init` 要从 GitHub 归档里 vendor 它),
      # 所以改了 lib 必须重新 build 并提交, 否则这里会失败。
      - name: 校验 core-js/dist 与源码同步
        working-directory: core-js
        run: |
          npm run build
          git diff --exit-code -- dist

      - name: 安装文档站依赖
        working-directory: docs/web
        run: npm ci

      - name: 构建文档站(项目站点挂在 /Axon/ 下)
        working-directory: docs/web
        env:
          DOCS_BASE: /Axon/
        run: npm run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/web/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
