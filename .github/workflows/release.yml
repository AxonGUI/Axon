name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/覆盖的 tag(留空则只构建不上传)"
        required: false

permissions:
  contents: write

jobs:
  python-package:
    name: Python 包 (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: 构建 axon-gui 的 wheel 与 sdist
        working-directory: core-py
        run: uv build --out-dir ../artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: artifacts/*
          if-no-files-found: error

  js-package:
    name: JS 包 (npm pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core-js/package-lock.json
      - working-directory: core-js
        run: npm ci
      - working-directory: core-js
        run: npm run build
      - name: 校验 core-js/dist 与源码同步
        working-directory: core-js
        run: git diff --exit-code -- dist/build-info.json
      - working-directory: core-js
        run: |
          mkdir -p ../artifacts
          npm pack --pack-destination ../artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: js-package
          path: artifacts/*.tgz
          if-no-files-found: error

  publish:
    name: 创建 GitHub Release
    needs: [python-package, js-package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: 列出要发布的资产
        run: ls -lh release

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          name: Axon ${{ github.ref_name }}
          body: |
            ## 这个版本里有什么

            - **Python 包**: `axon-gui` 的 wheel 与 sdist(`pip install axon_gui-*.whl`)
            - **JS 包**: `axon-gui` 的 npm tarball(`npm i ./axon-gui-*.tgz`)
            - **项目模板**: 在 [AxonGUI/templates](https://github.com/AxonGUI/templates)（`axon-gui init` 自动下载）
            - **说明书**: 在 [axongui.github.io](https://axongui.github.io/)
            - **桌面客户端**: 说明书的可交互客户端在 [axongui.github.io 的 Release](https://github.com/AxonGUI/axongui.github.io/releases) 里

            ```bash
            pip install axon-gui==${{ github.ref_name }}
            npm i axon-gui@latest
            ```
