version: 2
updates:
  # 每个生态每周最多开一个 PR：minor / patch 全部塞进一个分组，
  # major 一律不提（会破坏 API，要看 release notes 手动升）。
  - package-ecosystem: npm
    directory: /core-js
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      core-js-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /docs/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docs-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /core-py
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
