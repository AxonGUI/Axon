name: Bug 报告
description: 报错、跑不起来、行为不对
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        报之前先跑一遍这三条，能省一半来回：

        ```bash
        core-py/.venv/bin/python core-py/tests/run_web_tests.py   # 接口层
        docs/.venv/bin/python docs/verify_docs.py                  # 文档站示例
        docs/verify_offline.py                                     # 纯网页形态
        ```
  - type: dropdown
    id: surface
    attributes:
      label: 出问题的部分
      options:
        - Python 侧（开窗口、注册控制器）
        - JS 侧（调用 Axon.xxx、事件、Store）
        - CLI 模板（axon-gui init 生成的项目）
        - 文档客户端（Release 里的 AxonDocs.exe）
        - 文档站（axongui.github.io）
        - 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: axon-gui 的版本（`pip show axon-gui` / `npm ls axon-gui`），或 commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 系统、Python、Node、Qt 相关（Linux 还要 libxkbfile1 装没装）
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 贴完整报错（Python traceback / 浏览器 console 都要）
      render: text
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 你期望什么
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: 尽量能直接拷跑；只贴关键代码，不要整个项目
      render: python
    validations:
      required: false
