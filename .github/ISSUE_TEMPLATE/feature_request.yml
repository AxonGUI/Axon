name: "Feature request / 功能建议"
description: "Something you want, or something that feels awkward / 想要的东西、觉得别扭的地方"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / What problem are you solving
      description: 先说场景，再说你希望的 API 长什么样 / Describe the situation first, then the API you would like
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的写法 / How you would write it
      render: python
    validations:
      required: false
  - type: textarea
    id: alt
    attributes:
      label: 现在怎么绕过去的 / Current workaround
      description: 有 workaround 的话写一下，说明这个需求有多疼 / If you have a workaround, say so — it shows how painful the gap is
    validations:
      required: false
