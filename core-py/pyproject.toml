[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axon-gui"
version = "5.4.8"
description = "PySide6 + Web hybrid desktop framework: expose Python objects to the page and call JS back / 基于 PySide6 的 Qt-Web 混合开发框架"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["PySide6"]
[tool.setuptools]
packages = { find = {} }

[tool.setuptools.package-data]
axon = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["axon"]


[project.scripts]
axon-gui = "axon.cli:main"
